name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EventQRBackend/eventqr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compile + unit tests + packaging + any verify-phase checks. The OWASP
      # dependency-check is NOT run here (slow, NVD-dependent); see dependency-check.yml.
      - name: Verify
        run: mvn -B verify

  mobile:
    name: Android lint, build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EventQRMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Caches the Gradle wrapper, dependencies, and build cache between runs.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint (release variant)
        run: ./gradlew --no-daemon lintRelease
      # Builds the minified release APK (unsigned unless signing secrets are set) so
      # R8 keep-rule problems fail CI instead of crashing a shipped build.
      - name: Release build
        run: ./gradlew --no-daemon assembleRelease
