# Supabase free tier: ~60 connections shared across all clients; see application.properties.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=3000
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Platform threads, NOT virtual threads. Reverted from spring.threads.virtual.enabled=true:
# virtual threads are not preempted, so one CPU-bound task (bcrypt login, QR/PDF rendering,
# a large JSON serialization) holds its carrier until it returns and every other request —
# including Render's 5 s health probe — waits behind it. The carrier pool is sized from
# availableProcessors, which is 1 when the container gets a 0.1 CPU cgroup quota, i.e. exactly
# the "one carrier" case. A small bounded platform pool is preempted by the OS, so a cheap
# probe still gets scheduled between long tasks. Request threads are cheap here anyway: they
# are I/O-bound and capped by the Hikari pool (5) far below this limit.
spring.threads.virtual.enabled=false
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
# Dedicated, single-threaded scheduler pool. Scheduled DB sweeps/purges must never run on a
# request thread or compete with request handling for the tiny CPU share. (With virtual
# threads enabled this setting was ignored — every @Scheduled run got its own virtual thread
# on the shared carrier pool.)
spring.task.scheduling.pool.size=1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Exposes /actuator/health/liveness and /actuator/health/readiness (permitted in SecurityConfig).
management.endpoint.health.probes.enabled=true
# Render probes /actuator/health/readiness with a fixed 5 s timeout and restarts the instance
# when it is missed. Pin the readiness group to in-process state only:
#   - readinessState: a volatile enum read, ~3 ms measured locally, zero I/O;
#   - never the DB: a DB-backed indicator costs a full Hikari connection-timeout (5 s) whenever
#     the pool is exhausted or the database is unreachable, which is the whole 5 s budget.
# The database check stays on /actuator/health (and /api/v1/health) for humans/other probes.
management.endpoint.health.group.readiness.include=readinessState
# No mail health indicator exists (no spring-boot-starter-mail; mail is sent over the Brevo REST
# API), but pin it off so adding JavaMail later cannot put a remote SMTP probe on the probe path.
management.health.mail.enabled=false
# Left empty on purpose (Render publishes no inbound proxy ranges); see application.properties.
server.tomcat.remoteip.internal-proxies=${RENDER_PROXY_CIDRS:}
