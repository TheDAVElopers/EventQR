spring.application.name=eventqr
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:eventqr}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Small pool by default: Supabase free tier allows ~60 connections shared by every client, and one
# Render instance (0.1 CPU) cannot use more than a handful concurrently. Override via DB_POOL_MAX/DB_POOL_MIN.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# JDBC batching: group INSERT statements (order_inserts aligns cross-table FK inserts)
# so Hibernate can flush up to batch_size rows per JDBC round-trip.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.flyway.enabled=true
# Fresh-deploy path: against an empty database Flyway runs V16__baseline_schema.sql
# (CREATE TABLE IF NOT EXISTS) and then V17+/V18 as normal migrations; Hibernate's
# ddl-auto=validate then verifies the entity mapping against the migrated schema.
# NEVER switch ddl-auto back to update/create on an environment that has already been
# migrated by Flyway — the two would fight over schema ownership (Flyway checksums
# would drift and validation would fail).
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
server.port=${PORT:10000}
server.address=0.0.0.0
# Gzip response compression for JSON payloads (enabled per Render's docs for Node-like
# services; Tomcat compresses only when the client advertises Accept-Encoding: gzip).
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
# Deployed behind Render's reverse proxy: let the container read X-Forwarded-For so
# getRemoteAddr() (and our rate-limiting IP) reflects the real client, not the proxy.
server.forward-headers-strategy=native
# Tomcat's own trusted-proxy list stays EMPTY on purpose: Render does not publish its inbound proxy
# ranges, so there is nothing to put here, and an empty value means the container rewrites nothing.
# The real client IP is resolved by ClientIp instead (see app.client-ip.trusted-header below).
server.tomcat.remoteip.internal-proxies=${RENDER_PROXY_CIDRS:}
# Real client IP (rate limiting, audit). Render's edge writes CF-Connecting-IP on every request and
# overwrites whatever the caller sent, so it cannot be forged; ClientIp prefers it and falls back to
# the rightmost X-Forwarded-For entry. Set CLIENT_IP_TRUSTED_HEADER= (empty) when NOT hosted behind
# Render's edge, because on any other host a caller could set that header themselves.
app.client-ip.trusted-header=${CLIENT_IP_TRUSTED_HEADER:CF-Connecting-IP}
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.secret=${JWT_SECRET}
# Access tokens are short-lived; the app exchanges its rotating refresh token (30 days by default,
# see RefreshTokenService) for a new one via POST /api/v1/auth/refresh. NOTE: if the deployment
# sets JWT_EXPIRATION_MS explicitly, that value wins over this default.
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
# File storage: "db" keeps uploads in Postgres (default); "s3" stores new uploads in an S3 or
# S3-compatible bucket. Files already in the database keep being served either way.
app.storage.type=${STORAGE_TYPE:db}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:us-east-1}
# Leave empty for AWS S3. Set for R2, MinIO, Spaces, etc. (usually with S3_PATH_STYLE=true).
app.storage.s3.endpoint=${S3_ENDPOINT:}
# Leave both empty to use the standard AWS credential chain (env vars, instance role, ...).
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.path-style=${S3_PATH_STYLE:false}
app.frontend-base-url=${FRONTEND_BASE_URL:https://eventqr.app}
# Default business timezone for "today" boundaries (e.g. staff/event daily transaction
# windows). Override per environment via APP_TIMEZONE (IANA name, e.g. Asia/Manila).
app.timezone=${APP_TIMEZONE:Asia/Manila}
